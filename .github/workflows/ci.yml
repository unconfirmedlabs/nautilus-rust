name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run tests with test-utils
        run: cargo test --workspace --all-targets --locked --features test-utils

      - name: Check examples do not enable test-utils
        run: |
          sh scripts/assert-no-test-utils.sh nautilus-example-hash-attestor x86_64-unknown-linux-musl
          sh scripts/assert-no-test-utils.sh nautilus-example-hello-world x86_64-unknown-linux-musl
